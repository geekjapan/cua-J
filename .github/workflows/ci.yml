name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python-decisions:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      UV_NO_PROGRESS: "1"
      PYTHONDONTWRITEBYTECODE: "1"
    defaults:
      run:
        shell: bash
        working-directory: libs/cua-driver/examples/jev-use
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false

      - name: Install locked Python dependencies
        run: |
          python3 -m pip install --disable-pip-version-check uv==0.11.6
          uv sync --frozen --python 3.13.13

      - name: Test decision adapters and native execution policy without credentials
        run: |
          mkdir -p "$GITHUB_WORKSPACE/artifacts/ci"
          trap 'tail -n 100 "$GITHUB_WORKSPACE/artifacts/ci/python-decisions.log"' EXIT
          uv run --frozen python -m unittest discover -s python/tests > "$GITHUB_WORKSPACE/artifacts/ci/python-decisions.log" 2>&1

      - name: Verify tracked sources are unchanged
        if: always()
        run: git diff --exit-code

      - name: Upload Python test log
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: python-decision-logs
          path: artifacts/ci/python-decisions.log
          retention-days: 7
          if-no-files-found: warn

  verify:
    runs-on: macos-26
    timeout-minutes: 45
    env:
      CARGO_BUILD_JOBS: "2"
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_PROFILE_TEST_DEBUG: "0"
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Install verification tools
        run: |
          set -o pipefail
          mkdir -p artifacts/ci
          rustup toolchain install 1.95.0 --profile minimal 2>&1 | tee artifacts/ci/setup.log
          python3 -m venv "$RUNNER_TEMP/ci-venv" 2>&1 | tee -a artifacts/ci/setup.log
          "$RUNNER_TEMP/ci-venv/bin/python" -m pip install --disable-pip-version-check z3-solver==5.1.0.0 2>&1 | tee -a artifacts/ci/setup.log
          echo "$RUNNER_TEMP/ci-venv/bin" >> "$GITHUB_PATH"

      - name: Build CLI and Rust SDK
        run: |
          set -o pipefail
          cargo +1.95.0 build --locked --manifest-path libs/cua-driver/rust/Cargo.toml -p cua-driver -p cua-driver-sdk 2>&1 | tee artifacts/ci/build.log

      - name: Test core, contract and SDK
        run: |
          set -o pipefail
          cargo +1.95.0 test --locked --manifest-path libs/cua-driver/rust/Cargo.toml -p cua-driver-core -p cua-driver-contract -p cua-driver-sdk 2>&1 | tee artifacts/ci/tests.log

      - name: Test CLI serially
        run: |
          trap 'tail -n 100 artifacts/ci/cli-tests.log' EXIT
          cargo +1.95.0 test --locked --manifest-path libs/cua-driver/rust/Cargo.toml -p cua-driver -- --test-threads=1 > artifacts/ci/cli-tests.log 2>&1

      - name: Verify bounded capture consumption and mutation detection
        run: |
          set -o pipefail
          python3 scripts/verify-formal.py --mutation 2>&1 | tee artifacts/ci/formal.log

      - name: Verify tracked sources are unchanged
        if: always()
        run: |
          set -o pipefail
          mkdir -p artifacts/ci
          git diff --exit-code 2>&1 | tee artifacts/ci/source-diff.log

      - name: Upload CI logs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: ci-logs
          path: artifacts/ci/*.log
          retention-days: 7
          if-no-files-found: warn
