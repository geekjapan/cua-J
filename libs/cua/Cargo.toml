[workspace]
resolver = "2"
members = ["crates/cua-telemetry"]

[workspace.package]
version = "0.9.0"
edition = "2024"
authors = ["trycua"]
license = "MIT"
repository = "https://github.com/trycua/cua"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
hex = "0.4"
rand = "0.9"
tempfile = "3"
